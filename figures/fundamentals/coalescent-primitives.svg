       x="14"
       y="22"
       width="442"
       height="470"
       rx="20"
       id="rect1" />
    <text
       class="heading"
       x="42"
       y="68"
       id="text1">Coalesce</text>
    <text
       class="text"
       x="42"
       y="100"
       id="text2">Two lineages join to form an older ancestor.</text>
    <path
       class="edge"
       d="M 377,307 C 300,292 220,265 101,265"
       id="path2" />
    <path
       class="edge"
       d="M 377,329 C 300,344 220,370 101,370"
       id="path3" />
    <circle
       class="inactive"
       cx="74"
       cy="265"
       r="27"
       id="circle3" />
    <text
       class="letter"
       x="74"
       y="265"
       id="text3">A</text>
    <circle
       class="inactive"
       cx="74"
       cy="370"
       r="27"
       id="circle4" />
    <text
       class="letter"
       x="74"
       y="370"
       id="text4">B</text>
    <circle
       class="active"
       cx="406"
       cy="318"
       r="29"
       id="circle5" />
    <text
       class="letter"
       x="406"
       y="318"
       id="text5">A</text>
  </g>
  <g
