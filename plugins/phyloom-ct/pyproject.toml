[project]
name = "phyloom-ct"
version = "0.1.0"
description = "Phyloom plugin for contact-tracing epidemiological simulations"
readme = "README.md"
authors = [
    { name = "gabriele-marino", email = "gabmarino.8601@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "phyloom>=0.1.0",
]

[project.entry-points."phyloom.plugins"]
ct = "phyloom_ct.ct"

[tool.uv.sources]
phyloom = { path = "../..", editable = true }

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"
