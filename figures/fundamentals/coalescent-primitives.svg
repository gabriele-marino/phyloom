       x="492"
       y="22"
       width="442"
       height="470"
       rx="20"
       id="rect5" />
    <text
       class="heading"
       x="520"
       y="68"
       id="text6">Spawn</text>
    <text
       class="text"
       x="520"
       y="100"
       id="text7">A scheduled sample adds a new active lineage.</text>
    <!-- Unaffected lineages sit quietly behind the new lineage. -->
    <path
