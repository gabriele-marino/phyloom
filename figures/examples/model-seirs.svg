<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-model-seirs desc-model-seirs" width="1210" height="600" viewBox="0 0 1210 600">
  <title id="title-model-seirs">Susceptible-exposed-infectious-recovered-susceptible model</title>
  <desc id="desc-model-seirs">Infectious lineages I draw on the susceptible pool S to create new exposed lineages E at rate lambda. Exposed lineages become infectious at rate 1 over T_E. Infectious lineages are observed (sampled) at rate mu times s, moving to O, or recover unobserved at rate mu times one minus s, moving to R. Recovered hosts return to the susceptible pool at rate omega.</desc>
  <defs>
    <marker id="arrow-teal-model-seirs" viewBox="0 0 24 24" refX="1" refY="12" markerWidth="24" markerHeight="24" markerUnits="userSpaceOnUse" overflow="visible" orient="auto">
      <path d="M 1,3 23,12 1,21 Z" fill="#0891b2"/>
    </marker>
    <marker id="arrow-blue-model-seirs" viewBox="0 0 24 24" refX="1" refY="12" markerWidth="24" markerHeight="24" markerUnits="userSpaceOnUse" overflow="visible" orient="auto">
      <path d="M 1,3 23,12 1,21 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-dark-model-seirs" viewBox="0 0 24 24" refX="1" refY="12" markerWidth="24" markerHeight="24" markerUnits="userSpaceOnUse" overflow="visible" orient="auto">
      <path d="M 1,3 23,12 1,21 Z" fill="#0f172a"/>
    </marker>
    <marker id="arrow-red-model-seirs" viewBox="0 0 24 24" refX="1" refY="12" markerWidth="24" markerHeight="24" markerUnits="userSpaceOnUse" overflow="visible" orient="auto">
      <path d="M 1,3 23,12 1,21 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-gray-model-seirs" viewBox="0 0 24 24" refX="1" refY="12" markerWidth="24" markerHeight="24" markerUnits="userSpaceOnUse" overflow="visible" orient="auto">
      <path d="M 1,3 23,12 1,21 Z" fill="#64748b"/>
    </marker>
    <style>
      .compartment-label { font: 700 64px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; text-anchor: middle; }
      .compartment-name { font: 600 24px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; text-anchor: middle; }
      .rate-label { font: 700 34px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; text-anchor: middle; }
      .var-label { font: 700 28px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #0f172a; text-anchor: middle; }
      .var-note { font: 600 20px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; text-anchor: middle; }
      .teal-compartment { fill: #ecfeff; stroke: #0891b2; stroke-width: 5; }
      .blue-compartment { fill: #eff6ff; stroke: #2563eb; stroke-width: 5; }
      .s-compartment { fill: #f8fafc; stroke: #64748b; stroke-width: 5; }
      .u-compartment { fill: #fef2f2; stroke: #dc2626; stroke-width: 5; }
      .pool-fill { fill: #a5dbe8; }
      .pool-frame { fill: none; stroke: #0891b2; stroke-width: 5; }
      .teal-line { fill: none; stroke: #0891b2; stroke-width: 5; }
      .teal-arrow { fill: none; stroke: #0891b2; stroke-width: 5; stroke-linejoin: round; marker-end: url(#arrow-teal-model-seirs); }
      .blue-line { fill: none; stroke: #2563eb; stroke-width: 5; }
      .blue-arrow { fill: none; stroke: #2563eb; stroke-width: 5; stroke-linejoin: round; marker-end: url(#arrow-blue-model-seirs); }
      .event-arrow { fill: none; stroke: #0f172a; stroke-width: 5; stroke-linejoin: round; marker-end: url(#arrow-dark-model-seirs); }
      .scheduled-arrow { fill: none; stroke: #0f172a; stroke-width: 4; stroke-dasharray: 12 9; stroke-linejoin: round; marker-end: url(#arrow-dark-model-seirs); }
      .decision-point { fill: #0f172a; stroke: #fff; stroke-width: 4; }
      .sampled-arrow { fill: none; stroke: #64748b; stroke-width: 5; stroke-linejoin: round; marker-end: url(#arrow-gray-model-seirs); }
      .unsampled-arrow { fill: none; stroke: #dc2626; stroke-width: 5; stroke-linejoin: round; marker-end: url(#arrow-red-model-seirs); }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#fff"/>
  <clipPath id="pool-clip-80"><rect x="80" y="175" width="220" height="120" rx="18"/></clipPath>
  <rect x="80" y="175" width="220" height="120" rx="18" fill="#ecfeff"/>
  <rect class="pool-fill" x="80" y="175" width="148" height="120" clip-path="url(#pool-clip-80)"/>
  <rect class="pool-frame" x="80" y="175" width="220" height="120" rx="18"/>
  <text class="compartment-label" x="190" y="258">S</text>
  <text class="compartment-name" x="190" y="338">Susceptible pool</text>
  <circle class="teal-compartment" cx="488" cy="233" r="72"/>
  <text class="compartment-label" x="488" y="256">E</text>
  <text class="compartment-name" x="488" y="335">Exposed</text>
  <circle class="blue-compartment" cx="728" cy="233" r="72"/>
  <text class="compartment-label" x="728" y="256">I</text>
  <text class="compartment-name" x="728" y="335">Infectious</text>
  <path class="teal-line" d="M 300,207 L 360,143"/>
  <path class="blue-line" d="M 688,166 C 660,60 420,70 360,143"/>
  <path class="teal-arrow" d="M 360,143 C 344,192 360,214 390,220"/>
  <circle class="decision-point" cx="360" cy="143" r="11"/>
  <text class="rate-label" x="532" y="66">λ</text>
  <path class="blue-arrow" d="M 572,233 L 634,233"/>
  <text class="rate-label" x="605" y="205">1/T<tspan font-size="24" dy="6">E</tspan></text>
  <path class="sampled-arrow" d="M 800,206 L 1021,120"/>
  <text class="rate-label" x="913" y="124">μs</text>
  <path class="unsampled-arrow" d="M 800,262 L 1027,348"/>
  <text class="rate-label" x="910" y="370">μ(1-s)</text>
  <circle class="s-compartment" cx="1118" cy="85" r="72"/>
  <text class="compartment-label" x="1118" y="108">O</text>
  <text class="compartment-name" x="1118" y="187">Observed</text>
  <circle class="u-compartment" cx="1118" cy="388" r="72"/>
  <text class="compartment-label" x="1118" y="411">R</text>
  <text class="compartment-name" x="1118" y="490">Recovered</text>
  <path class="teal-arrow" d="M 1058,442 C 950,560 880,578 800,578 L 200,578 C 20,578 20,540 20,330 C 20,245 30,235 56,235"/>
  <text class="rate-label" x="520" y="552">ω</text>
</svg>
