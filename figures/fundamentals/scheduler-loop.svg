      .card { fill: #f8fafc; stroke: #dbe4ee; stroke-width: 2; }
      .source-card { fill: #fff; stroke: #dbe4ee; stroke-width: 2; }
      .main-card { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2.5; }
      .apply-card { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2.5; }
      .decision { fill: #fffbeb; stroke: #d97706; stroke-width: 3; }
      .stop-card { fill: #fef2f2; stroke: #dc2626; stroke-width: 2.5; }
      .heading { font: 700 24px system-ui, -apple-system, Segoe UI, sans-serif; fill: #0f172a; }
      .advance-heading { fill: #4338ca; }
      .apply-heading { fill: #15803d; }
