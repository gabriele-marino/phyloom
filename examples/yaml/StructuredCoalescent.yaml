# Structured coalescent
#
# The genealogy of lineages sampled from a population structured into two
# subpopulations (demes), `A` and `B`, connected by migration. Backward in
# time, lineages coalesce only within their deme and migrate between demes
# at a constant rate, so two lineages in different demes must come to share
# a deme before they can merge.
#
# Run it from the repository root with `phyloom examples/yaml/StructuredCoalescent.yaml`.
# `examples/python/StructuredCoalescent.py` builds the same model with the Python API.

# ------------------------------------------------------------------------------
# Dataset settings
# ------------------------------------------------------------------------------

# Directory where the dataset is written, relative to the directory phyloom is
# run from. Splits that already exist there are skipped, not overwritten.
output_dir: outputs/StructuredCoalescent-yaml

# Number of accepted samples in each split. Each split gets a folder in
# `output_dir`, with one `data/<sample-id>/` folder per sample and a `metadata.csv`
# with one row per sample (context values, rejections, run time, and logs).
n_samples: {train: 10, val: 2, test: 2}

# Number of parallel worker processes; `-1` uses all CPU cores.
n_jobs: -1

# Master random seed: rerunning with the same seed gives the same dataset.
seed: 43

# ------------------------------------------------------------------------------
# Context
# ------------------------------------------------------------------------------

# Parameters of one sample, drawn anew for every sample and saved in
# `metadata.csv`. Entries are evaluated top to bottom; each is a constant, a
# Python expression of earlier entries (NumPy is available as `np`), or a random
# draw `{type: <method>, ...}` that calls NumPy's `Generator.<method>` with the
# given arguments. Here, there are no draws: every sample shares the same
# parameters.
context:
  # Effective population size N_e of each deme, which sets the time unit, and
  # the rate 1 / (2 N_e) at which each pair of lineages in a deme coalesces.
  effective_population_size: 1
  coalescence_rate: 1 / (2 * effective_population_size)

  # Rate at which each lineage changes deme, backward in time, in either
  # direction. It equals the coalescence rate, so both processes matter.
  migration_rate: 0.5

# ------------------------------------------------------------------------------
# Model
# ------------------------------------------------------------------------------

# The process simulated in each trial. Each event pairs a rule (what happens)
# with a hazard (its rate per opportunity, e.g. per eligible lineage or pair).
# Rule and hazard parameters can be expressions of the context entries.
model:
  # Coalescent: backward in time, from t = 0 (the present, when the lineages
  # are sampled) into the past.
  spec: coalescent
  # Number of sampled lineages in each state (here, four in each deme).
  init_population: {A: 4, B: 4}

  events:
    # Migration: `retrace` replaces a lineage in `current_state` with its
    # ancestor in `ancestral_state`. As time runs backward, a retrace from `A` to
    # `B` means that the ancestor belonged to deme `B`: forward in time, a
    # migration from `B` into `A`.
    - rule: {spec: retrace, current_state: A, ancestral_state: B}
      hazard: {spec: constant, rate: migration_rate}
    - rule: {spec: retrace, current_state: B, ancestral_state: A}
      hazard: {spec: constant, rate: migration_rate}

    # One `coalesce` rule per deme, so only lineages in the same deme can merge.
    # Each has n(n - 1)/2 opportunities, where `n` counts the lineages in its
    # deme.
    - rule: {spec: coalesce, current_states: [A, A], ancestral_state: A}
      hazard: {spec: constant, rate: coalescence_rate}
    - rule: {spec: coalesce, current_states: [B, B], ancestral_state: B}
      hazard: {spec: constant, rate: coalescence_rate}

# ------------------------------------------------------------------------------
# Trials
# ------------------------------------------------------------------------------

# Python expression checked after every step: the trial ends as soon as it is
# true. Here, it ends at the most recent common ancestor: `model.history()`
# requires a single root lineage. The criterion is essential, since retrace
# events would otherwise keep firing on the root forever. There is no
# `acceptance_criterion`, so every trial is accepted.
stop_criterion: model.count_current_lineages() == 1

# ------------------------------------------------------------------------------
# Outputs
# ------------------------------------------------------------------------------

# Python statements run on each accepted trial; `output_dir` is the sample's own
# folder (e.g. `outputs/StructuredCoalescent-yaml/train/data/1`). `model.history()`
# is the full genealogy, and `dump()` writes it in Newick format. Here, each retrace
# is kept as a node with one child, and node labels carry the deme (e.g. `11|A`),
# recording the deme of each ancestral lineage over time.
output_hooks:
  - model.history().dump(output_dir / "genealogy.nwk")
