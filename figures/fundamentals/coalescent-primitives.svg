     x1="54.131977"
     y1="557.17896"
     x2="1359.132"
     y2="557.17896"
     id="line19" />
  <circle
     class="active"
     cx="376.42142"
     cy="613.1745"
     r="14"
     id="circle19" />
  <text
     class="text"
     x="402.42142"
     y="619.1745"
     id="text20">Active lineage after the event</text>
  <circle
     class="inactive"
     cx="710.42145"
     cy="613.1745"
     r="14"
     id="circle20" />
  <text
     class="text"
     x="736.42145"
     y="619.1745"
     id="text21">Lineage no longer active after the event</text>
</svg>
