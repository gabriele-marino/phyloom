  <title
     id="title-model-bdei">Birth-death exposed-infectious model</title>
  <desc
     id="desc-model-bdei">An exposed compartment E progresses to infectious I with rate epsilon. Infectious lineages create new exposed lineages with rate lambda. Removal from I with rate mu leads to a decision point, which splits diagonally into sampled S with probability p and unsampled U with probability one minus p.</desc>
