  <title
     id="title-model-bd">Birth-death model with sampling probability</title>
  <desc
     id="desc-model-bd">An infectious compartment I has a birth self-loop with rate lambda. A removal event with rate mu leads to a decision point, which splits diagonally into sampled S with probability p and unsampled U with probability one minus p.</desc>
