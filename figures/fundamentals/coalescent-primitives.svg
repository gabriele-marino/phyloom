       cy="250"
       r="13"
       id="circle7" />
    <path
       class="context-lineage"
       d="M 533,390 H 901"
       id="path8" />
    <circle
       class="context-node"
       cx="520"
       cy="390"
       r="13"
       id="circle9" />
    <circle
       class="context-node"
       cx="914"
       cy="390"
       r="13"
       id="circle10" />
    <line
