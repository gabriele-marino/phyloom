<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-model-sir desc-model-sir" width="913" height="500" viewBox="0 0 913 500">
  <title id="title-model-sir">Susceptible-infectious-recovered model</title>
  <desc id="desc-model-sir">Infectious lineages I draw on the susceptible pool S to create new infectious lineages at rate lambda. Infectious lineages are observed (sampled) at rate psi, moving to O, or recover unobserved at rate mu, moving to R.</desc>
  <defs>
    <marker id="arrow-teal-model-sir" viewBox="0 0 24 24" refX="1" refY="12" markerWidth="24" markerHeight="24" markerUnits="userSpaceOnUse" overflow="visible" orient="auto">
      <path d="M 1,3 23,12 1,21 Z" fill="#0891b2"/>
    </marker>
    <marker id="arrow-blue-model-sir" viewBox="0 0 24 24" refX="1" refY="12" markerWidth="24" markerHeight="24" markerUnits="userSpaceOnUse" overflow="visible" orient="auto">
      <path d="M 1,3 23,12 1,21 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-dark-model-sir" viewBox="0 0 24 24" refX="1" refY="12" markerWidth="24" markerHeight="24" markerUnits="userSpaceOnUse" overflow="visible" orient="auto">
      <path d="M 1,3 23,12 1,21 Z" fill="#0f172a"/>
    </marker>
    <marker id="arrow-red-model-sir" viewBox="0 0 24 24" refX="1" refY="12" markerWidth="24" markerHeight="24" markerUnits="userSpaceOnUse" overflow="visible" orient="auto">
      <path d="M 1,3 23,12 1,21 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-gray-model-sir" viewBox="0 0 24 24" refX="1" refY="12" markerWidth="24" markerHeight="24" markerUnits="userSpaceOnUse" overflow="visible" orient="auto">
      <path d="M 1,3 23,12 1,21 Z" fill="#64748b"/>
    </marker>
    <style>
      .compartment-label { font: 700 64px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; text-anchor: middle; }
      .compartment-name { font: 600 24px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; text-anchor: middle; }
      .rate-label { font: 700 34px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; text-anchor: middle; }
      .var-label { font: 700 28px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #0f172a; text-anchor: middle; }
      .var-note { font: 600 20px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; text-anchor: middle; }
      .teal-compartment { fill: #ecfeff; stroke: #0891b2; stroke-width: 5; }
      .blue-compartment { fill: #eff6ff; stroke: #2563eb; stroke-width: 5; }
      .s-compartment { fill: #f8fafc; stroke: #64748b; stroke-width: 5; }
      .u-compartment { fill: #fef2f2; stroke: #dc2626; stroke-width: 5; }
      .pool-fill { fill: #a5dbe8; }
      .pool-frame { fill: none; stroke: #0891b2; stroke-width: 5; }
      .teal-line { fill: none; stroke: #0891b2; stroke-width: 5; }
      .teal-arrow { fill: none; stroke: #0891b2; stroke-width: 5; stroke-linejoin: round; marker-end: url(#arrow-teal-model-sir); }
      .blue-line { fill: none; stroke: #2563eb; stroke-width: 5; }
      .blue-arrow { fill: none; stroke: #2563eb; stroke-width: 5; stroke-linejoin: round; marker-end: url(#arrow-blue-model-sir); }
      .event-arrow { fill: none; stroke: #0f172a; stroke-width: 5; stroke-linejoin: round; marker-end: url(#arrow-dark-model-sir); }
      .scheduled-arrow { fill: none; stroke: #0f172a; stroke-width: 4; stroke-dasharray: 12 9; stroke-linejoin: round; marker-end: url(#arrow-dark-model-sir); }
      .decision-point { fill: #0f172a; stroke: #fff; stroke-width: 4; }
      .sampled-arrow { fill: none; stroke: #64748b; stroke-width: 5; stroke-linejoin: round; marker-end: url(#arrow-gray-model-sir); }
      .unsampled-arrow { fill: none; stroke: #dc2626; stroke-width: 5; stroke-linejoin: round; marker-end: url(#arrow-red-model-sir); }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#fff"/>
  <clipPath id="pool-clip-20"><rect x="20" y="173" width="220" height="120" rx="18"/></clipPath>
  <rect x="20" y="173" width="220" height="120" rx="18" fill="#ecfeff"/>
  <rect class="pool-fill" x="20" y="173" width="148" height="120" clip-path="url(#pool-clip-20)"/>
  <rect class="pool-frame" x="20" y="173" width="220" height="120" rx="18"/>
  <text class="compartment-label" x="130" y="256">S</text>
  <text class="compartment-name" x="130" y="336">Susceptible pool</text>
  <circle class="blue-compartment" cx="427" cy="232" r="72"/>
  <text class="compartment-label" x="427" y="255">I</text>
  <text class="compartment-name" x="427" y="334">Infectious</text>
  <path class="teal-line" d="M 240,205 L 300,143"/>
  <path class="blue-line" d="M 390,168 C 372,112 330,100 300,143"/>
  <path class="blue-arrow" d="M 300,143 C 284,190 300,212 330,218"/>
  <circle class="decision-point" cx="300" cy="143" r="11"/>
  <text class="rate-label" x="322" y="104">λ</text>
  <path class="sampled-arrow" d="M 500,205 L 720,120"/>
  <text class="rate-label" x="612" y="124">ψ</text>
  <path class="unsampled-arrow" d="M 500,262 L 726,346"/>
  <text class="rate-label" x="612" y="368">μ</text>
  <circle class="s-compartment" cx="817" cy="85" r="72"/>
  <text class="compartment-label" x="817" y="108">O</text>
  <text class="compartment-name" x="817" y="187">Observed</text>
  <circle class="u-compartment" cx="817" cy="390" r="72"/>
  <text class="compartment-label" x="817" y="413">R</text>
  <text class="compartment-name" x="817" y="492">Recovered</text>
</svg>
