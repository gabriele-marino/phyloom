  <title
     id="title">Hybrid event scheduler loop</title>
  <desc
     id="desc">The scheduler compares the next stochastic event, next scheduled action, and inclusive time limit, then advances to the earliest time. After applying transitions and shuffling ties, it stops if the time limit is reached, no future event or action remains, or a stopping criterion is met; otherwise, it returns to the stochastic channels to re-evaluate proposals from the updated state.</desc>
