       x1="557.84937"
       y1="220"
       x2="557.84937"
       y2="416"
       id="line10"
       style="fill:#ff9955;stroke:#fdb381;stroke-opacity:1" />
    <text
       class="spawn-time"
       x="557.84937"
       y="209.77075"
       id="text10"
       style="font-style:normal;font-variant:normal;font-weight:600;font-stretch:normal;font-size:15px;line-height:normal;font-family:system-ui, '-apple-system', 'Segoe UI', sans-serif;fill:#ff9955">Spawn time</text>
    <path
       class="spawn-edge"
       d="M 583,320 H 858"
       id="path10" />
    <circle
       class="spawn-active"
       cx="556"
       cy="320"
       r="27"
       id="circle11" />
    <text
       class="letter"
       x="556"
       y="320"
       id="text11">A</text>
    <circle
       class="spawn-origin"
       cx="870"
       cy="320"
       r="12"
       id="circle12" />
  </g>
  <g
