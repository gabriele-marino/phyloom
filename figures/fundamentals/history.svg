  <title
     id="title">Hidden history and observed network</title>
  <desc
     id="desc">A timed BDSH history from origin time zero, with sampled tips, X-marked unobserved terminations, and a hybridization. The observed network below retains only sampled lineages while preserving event times and the hybridization ancestral to sampled tips.</desc>
