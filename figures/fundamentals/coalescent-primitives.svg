     x="709.13196"
     y="543.17896"
     text-anchor="middle"
     id="text18">backward simulation time</text>
  <text
     class="time-label"
     x="1384.132"
     y="543.17896"
     text-anchor="end"
     id="text19">older</text>
  <line
