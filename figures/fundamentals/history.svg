      .branch { fill: none; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
      .root-branch { fill: none; stroke: #334155; stroke-width: 8; stroke-linecap: round; }
      .purple { stroke: #7c3aed; }
      .green { stroke: #16a34a; }
      .hybrid { stroke: #db2777; }
      .node { fill: #fff; stroke: #334155; stroke-width: 3.5; }
      .retic-node { fill: #fff; stroke: #db2777; stroke-width: 4; }
      .sample { stroke: #fff; stroke-width: 3; }
      .sample-purple { fill: #7c3aed; }
      .sample-green { fill: #16a34a; }
      .sample-hybrid { fill: #db2777; }
      .unobserved { fill: none; stroke: #dc2626; stroke-width: 3; stroke-linecap: round; }
      .time-guide { stroke: #e2e8f0; stroke-width: 2; stroke-dasharray: 5 10; }
      .axis { stroke: #94a3b8; stroke-width: 3; }
      .tick { stroke: #94a3b8; stroke-width: 3; }
      .axis-arrow { fill: #94a3b8; }
    </style>
