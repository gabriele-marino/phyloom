[project]
name = "phyloom-adb"
version = "0.1.0"
description = "Phyloom plugin for age-dependent branching processes"
readme = "README.md"
authors = [
    { name = "gabriele-marino", email = "gabmarino.8601@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "phyloom>=0.1.0",
]

[project.entry-points."phyloom.plugins"]
adb = "phyloom_adb.adb"

[tool.uv.sources]
phyloom = { path = "../..", editable = true }

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"
