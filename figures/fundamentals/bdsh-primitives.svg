  <title
     id="title">BDSH lineage event primitives</title>
  <desc
     id="desc">Six event cards show finalize, sample with removal, sample without removal, continue as, birth from, and hybridize. An X marks the unobserved termination in finalize. Sampling without removal records one child and leaves the other active. Birth and continuation descendants may inherit or change state.</desc>
