  <title
     id="title-model-bdss">Birth-death superspreading model</title>
  <desc
     id="desc-model-bdss">A two-state BDSS schematic. Superspreader infectious lineages I sub S and ordinary infectious lineages I sub N generate new lineages with lambda-labelled arrows, are removed with rate mu, and then split by probability p into sampled S or unsampled U outcomes.</desc>
