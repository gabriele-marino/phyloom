# Susceptible-infectious-recovered (SIR)
#
# A transmission tree in a finite host population. Susceptible (`S`) and
# recovered (`R`) hosts are pools, plain counts without ancestry; infectious
# hosts are lineages in state `I`. An infection consumes one susceptible host
# and creates a new `I` lineage, and an `I` lineage recovers into `R`, either
# unobserved at rate μ or sampled at rate ψ.
#
# Run it from the repository root with `phyloom examples/yaml/SIR.yaml`.
# `examples/python/SIR.py` builds the same model with the Python API.

# ------------------------------------------------------------------------------
# Dataset settings
# ------------------------------------------------------------------------------

# Directory where the dataset is written, relative to the directory phyloom is
# run from. Splits that already exist there are skipped, not overwritten.
output_dir: outputs/SIR-yaml

# Number of accepted samples in each split. Each split gets a folder in
# `output_dir`, with one `data/<sample-id>/` folder per sample and a `metadata.csv`
# with one row per sample (context values, rejections, run time, and logs).
n_samples: {train: 100, val: 10, test: 10}

# Number of parallel worker processes; `-1` uses all CPU cores.
n_jobs: -1

# Master random seed: rerunning with the same seed gives the same dataset.
seed: 42

# ------------------------------------------------------------------------------
# Context
# ------------------------------------------------------------------------------

# Parameters of one sample, drawn anew for every sample and saved in
# `metadata.csv`. Entries are evaluated top to bottom; each is a constant, a
# Python expression of earlier entries (NumPy is available as `np`), or a random
# draw `{type: <method>, ...}` that calls NumPy's `Generator.<method>` with the
# given arguments.
context:
  # Basic reproduction number: the expected number of infections caused by one
  # infectious host in a fully susceptible population.
  R_0: {type: uniform, low: 1.5, high: 4}

  # Total recovery rate μ + ψ of an `I` lineage; `1 / exit_rate` is the mean
  # infectious period.
  exit_rate: {type: uniform, low: 0.05, high: 0.2}

  # Fraction `s` of recoveries that are sampled, which splits `exit_rate` into
  # unobserved (μ) and sampled (ψ) recoveries.
  s: {type: uniform, low: 0.2, high: 0.5}
  mu: exit_rate * (1 - s)
  psi: exit_rate * s

  # Initial number of susceptible hosts (`integers` excludes `high`: 200 to 1000).
  init_S: {type: integers, low: 200, high: 1001}

  # Infection rate λ per (`I` lineage, susceptible host) pair. With mass action,
  # the total rate is λ × #I × S, so R_0 = λ init_S / exit_rate. Solving for λ
  # keeps the meaning of `R_0` for any population size.
  la: R_0 * exit_rate / init_S

# ------------------------------------------------------------------------------
# Model
# ------------------------------------------------------------------------------

# The process simulated in each trial. Each event pairs a rule (what happens)
# with a hazard (its rate per opportunity, e.g. per eligible lineage or pair).
# Rule and hazard parameters can be expressions of the context entries.
model:
  # Compartmental epidemic: forward in time, infected hosts are lineages with a
  # state, and uninfected hosts are counted in pools.
  spec: epidemic
  init_state: I
  # Initial pool sizes; pools that are not listed, here `R`, start empty.
  init_pools: {S: init_S}

  events:
    # Infection has one opportunity per (`I` lineage, `S` host) pair. It removes
    # a host from `S` and splits the source into two `I` lineages (`child_states`
    # is omitted, so both keep the parent's state).
    - rule: {spec: infection, recipient_pool: S}
      hazard: {spec: constant, rate: la}

    # Recovery ends a lineage and adds a host to `R`. It is split into two
    # competing events, unobserved at rate μ and sampled (`sample: true`) at
    # rate ψ; sampling does not change the host's fate, so both lead to `R`.
    - rule: {spec: recovery, destination_pool: R}
      hazard: {spec: constant, rate: mu}
    - rule: {spec: recovery, destination_pool: R, sample: true}
      hazard: {spec: constant, rate: psi}

# ------------------------------------------------------------------------------
# Trials
# ------------------------------------------------------------------------------

# Python expression checked after every step: the trial ends as soon as it is
# true. Here, it ends at the 20th sampled recovery, so the trees mostly
# describe the growth phase.
stop_criterion: model.count_sampled_lineages() == 20

# Python expression checked when the trial ends: if false, the trial is
# rejected and rerun with the same context. Here, it requires an active
# lineage, rejecting epidemics that died out before 20 samples.
acceptance_criterion: model.count_current_lineages() > 0

# ------------------------------------------------------------------------------
# Outputs
# ------------------------------------------------------------------------------

# Extra `metadata.csv` columns: Python expressions evaluated on each accepted
# trial. Here, the final pool sizes, read from `model.pools`: how far the
# epidemic got through the population.
logs:
  still_susceptible: model.pools["S"]
  recovered: model.pools["R"]

# Python statements run on each accepted trial; `output_dir` is the sample's own
# folder (e.g. `outputs/SIR-yaml/train/data/1`). `model.history()` is the full
# history, and `model.history(model.get_sampled_lineages())` keeps only the ancestry
# of the sampled lineages; `dump()` writes it in Newick format. Here, only the
# sampled tree is written.
output_hooks:
  - model.history(model.get_sampled_lineages()).dump(output_dir / "sampled.nwk")
