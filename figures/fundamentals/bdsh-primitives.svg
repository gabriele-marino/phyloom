      .card { fill: #f8fafc; stroke: #dbe4ee; stroke-width: 2; }
      .heading { font: 700 24px system-ui, -apple-system, Segoe UI, sans-serif; fill: #0f172a; }
      .text { font: 500 17px system-ui, -apple-system, Segoe UI, sans-serif; fill: #475569; }
      .state { font: 700 20px system-ui, -apple-system, Segoe UI, sans-serif; fill: #0f172a; text-anchor: middle; dominant-baseline: central; }
      .edge { fill: none; stroke: #0f766e; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
