  <title
     id="title">BDSH hybridization network primitives</title>
  <desc
     id="desc">Three horizontal forward-time diagrams compare Lineage-degenerative, Lineage-neutral, and Lineage-generative hybridization. Solid outlined parents are replaced at the event; dotted outlined nodes remain active. Purple dotted nodes are hybrid descendants with two ancestors.</desc>
