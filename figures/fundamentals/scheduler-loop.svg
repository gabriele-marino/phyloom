      .connector { fill: none; stroke: #94a3b8; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
      .loop { fill: none; stroke: #0f766e; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .icon-stochastic { fill: #f0fdfa; stroke: #0f766e; }
      .icon-action { fill: #eff6ff; stroke: #0284c7; }
      .icon-limit { fill: #fffbeb; stroke: #d97706; }
      .icon-line { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
