  <title
     id="title">Coalescent event primitives</title>
  <desc
     id="desc">Three single-row event cards show coalescence, spawn, and retrace. Spawn adds a new active lineage at a scheduled time; the new lineage is highlighted while unaffected lineages remain faint in the background. Present-day lineages are on the left and older ancestors are on the right.</desc>
  <defs
     id="defs1">
    <style
       id="style1">
      .card { fill: #f8fafc; stroke: #dbe4ee; stroke-width: 2; }
      .heading { font: 700 28px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #0f172a; }
      .text { font: 500 16px system-ui, -apple-system, Segoe UI, sans-serif; fill: #475569; }
      .edge { fill: none; stroke: #0f766e; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .active { fill: #fff; stroke: #0f172a; stroke-width: 4; stroke-dasharray: 2 8; stroke-linecap: round; }
      .inactive { fill: #fff; stroke: #0f172a; stroke-width: 4; }
      .letter { font: 700 18px system-ui, -apple-system, Segoe UI, sans-serif; fill: #0f172a; text-anchor: middle; dominant-baseline: central; }
      .context-lineage { fill: none; stroke: #cbd5e1; stroke-width: 4; stroke-dasharray: 2 8; stroke-linecap: round; opacity: .45; }
      .context-node { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 3; stroke-dasharray: 2 7; opacity: .5; }
      .spawn-guide { stroke: #f59e0b; stroke-width: 3; stroke-dasharray: 7 8; opacity: .7; }
      .spawn-edge { fill: none; stroke: #0f766e; stroke-width: 9; stroke-linecap: round; }
      .spawn-active { fill: #fff; stroke: #0f766e; stroke-width: 5; stroke-dasharray: 2 8; stroke-linecap: round; }
      .spawn-origin { fill: #0f766e; stroke: #fff; stroke-width: 3; }
      .spawn-label { font: 600 16px system-ui, -apple-system, Segoe UI, sans-serif; fill: #0f766e; text-anchor: middle; }
      .spawn-time { font: 600 15px system-ui, -apple-system, Segoe UI, sans-serif; fill: #b45309; text-anchor: middle; }
      .time-arrow { stroke: #94a3b8; stroke-width: 5; stroke-linecap: round; marker-end: url(#arrow); }
      .time-label { font: 600 16px system-ui, -apple-system, Segoe UI, sans-serif; fill: #64748b; }
    </style>
    <marker
       id="arrow"
       markerWidth="14"
       markerHeight="14"
       refX="11"
       refY="7"
       orient="auto"
       markerUnits="userSpaceOnUse">
      <path
         d="M 0,0 14,7 0,14 Z"
         fill="#94a3b8"
         id="path1" />
    </marker>
  </defs>
  <g
